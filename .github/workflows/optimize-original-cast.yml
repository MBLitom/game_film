name: GAME FILM - Optimise original GLB cast for mobile (free)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/optimize-original-cast.yml
      - tools/optimize-cast.mjs
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: game-film-optimize-cast
  cancel-in-progress: true

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install free open-source GLB transform tools
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund @gltf-transform/core @gltf-transform/functions @gltf-transform/extensions meshoptimizer
      - name: Trim unrelated game animations and repack GLB actors
        run: |
          node tools/optimize-cast.mjs public/models/sky_preparation.glb public/models/sky_star.glb public/models/emma.glb
          node scripts/assert-cast.mjs public/models/*.glb
          ls -lh public/models
      - name: Commit verified optimised original actor assets
        run: |
          git config user.name "game-film-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/models/*.glb
          if ! git diff --cached --quiet; then
            git commit -m "Optimise original rigged 3D cast for phones [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
